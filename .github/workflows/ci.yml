name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, build, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    env:
      # Private corpus artifact (copyrighted; never committed). Configure these
      # repository secrets to run the full real-corpus suite in CI. Without
      # them, corpus tests are skipped explicitly and the release build is not
      # produced.
      CORPUS_ARCHIVE_URL: ${{ secrets.CORPUS_ARCHIVE_URL }}
      CORPUS_ARCHIVE_SHA256: ${{ secrets.CORPUS_ARCHIVE_SHA256 }}
      CORPUS_ARCHIVE_TOKEN: ${{ secrets.CORPUS_ARCHIVE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (matches gradle-daemon-jvm.properties)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK (pinned for determinism)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Fetch private corpus (when configured)
        if: env.CORPUS_ARCHIVE_URL != ''
        run: tools/corpus/fetch_corpus.sh

      - name: Verify corpus manifest
        if: env.CORPUS_ARCHIVE_URL != ''
        run: python3 tools/corpus/generate_manifest.py --check

      - name: Unit tests (full private corpus)
        if: env.CORPUS_ARCHIVE_URL != ''
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Unit tests (no private corpus; corpus tests skipped)
        if: env.CORPUS_ARCHIVE_URL == ''
        run: ./gradlew :app:testDebugUnitTest -PskipCorpusTests --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Compile instrumented tests
        run: ./gradlew :app:assembleDebugAndroidTest

      # Device-only: FTS5 MATCH must run on an API 30+ device/emulator.
      # Until CI provisions one, this is a documented pre-release manual gate
      # (README §10). It is never masked with continue-on-error.
      - name: Assemble release APK (requires private corpus)
        if: env.CORPUS_ARCHIVE_URL != ''
        run: ./gradlew :app:assembleRelease

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests (emulator, scan-fallback path)
    # The emulator image (like most OEM builds) has no FTS5, so this is the
    # only automated coverage of the normalized scan fallback users actually
    # get. Instrumented tests need the private corpus, so the expensive steps
    # are gated on the secret being configured (job-level `if` cannot read
    # `secrets`; step-level `env` can).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      CORPUS_ARCHIVE_URL: ${{ secrets.CORPUS_ARCHIVE_URL }}
      CORPUS_ARCHIVE_SHA256: ${{ secrets.CORPUS_ARCHIVE_SHA256 }}
      CORPUS_ARCHIVE_TOKEN: ${{ secrets.CORPUS_ARCHIVE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (matches gradle-daemon-jvm.properties)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Fetch private corpus
        if: env.CORPUS_ARCHIVE_URL != ''
        run: tools/corpus/fetch_corpus.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        if: env.CORPUS_ARCHIVE_URL != ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace
