[versions]
agp = "9.3.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
room = "2.7.2"
# Hilt >= 2.59 required: the Hilt Gradle plugin supports (and requires) AGP 9 only from 2.59 onward.
hilt = "2.60.1"
navigation = "2.9.3"
datastore = "1.1.7"
retrofit = "3.0.0"
okhttp = "5.1.0"
serialization = "1.9.0"
coil = "2.7.0"
work = "2.10.3"
timber = "5.0.1"
splash = "1.0.1"
# KSP must match the Kotlin version used by AGP 9 built-in Kotlin (2.2.10).
ksp = "2.2.10-2.0.2"
# Compose compiler plugin version follows the Kotlin version (2.2.10).
composeCompiler = "2.2.10"
composeBom = "2025.11.01"
activityCompose = "1.10.1"
lifecycle = "2.9.4"
coroutines = "1.9.0"
coroutinesTest = "1.7.3"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
hiltNavigationCompose = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref="hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref="hilt" }
navigation-compose = { module="androidx.navigation:navigation-compose", version.ref="navigation" }
datastore = { module="androidx.datastore:datastore-preferences", version.ref="datastore" }
retrofit = { module="com.squareup.retrofit2:retrofit", version.ref="retrofit" }
converter-gson = { module="com.squareup.retrofit2:converter-gson", version.ref="retrofit" }
okhttp-logging = { module="com.squareup.okhttp3:logging-interceptor", version.ref="okhttp" }
serialization-json = { module="org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref="serialization" }
coil-compose = { module="io.coil-kt:coil-compose", version.ref="coil" }
work-runtime = { module="androidx.work:work-runtime-ktx", version.ref="work" }
timber = { module="com.jakewharton.timber:timber", version.ref="timber" }
splashscreen = { module="androidx.core:core-splashscreen", version.ref="splash" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
hilt = { id="com.google.dagger.hilt.android", version.ref="hilt" }
ksp = { id="com.google.devtools.ksp", version.ref="ksp" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }